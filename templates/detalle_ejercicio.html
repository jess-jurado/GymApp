{% extends "base.html" %}

{% block title %}{{ nombre_ejercicio }} - GymBRoot{% endblock %}

{% block extra_css %}
<style>
    .ejercicio-image-container {
        width: 100%;
        border-radius: var(--border-radius);
        overflow: hidden;
        margin-bottom: 24px;
        background: #000;
        border: 1px solid #334155;
    }
    .ejercicio-image-container img {
        width: 100%;
        display: block;
        opacity: 0.9;
    }
    .serie-row {
        background: var(--card-bg);
        padding: 16px;
        border-radius: var(--border-radius);
        border: 1px solid #334155;
        margin-bottom: 12px;
    }
    .input-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 8px;
    }
    .input-card {
        background: #111827;
        padding: 8px;
        border-radius: 12px;
    }
    .input-card label {
        display: block;
        font-size: 0.75rem;
        color: var(--text-secondary);
        margin-bottom: 4px;
    }
    .input-card input {
        margin-bottom: 0;
        padding: 8px;
        text-align: center;
        border: none;
        background: transparent;
        font-size: 1.2rem;
        font-weight: 700;
    }
</style>
{% endblock %}

{% block content %}
<div style="margin-bottom: 24px;">
    <a href="javascript:history.back()" style="color: var(--accent-color); text-decoration: none; font-size: 0.9rem;">← Volver</a>
    <h1 style="margin-top: 12px;">{{ nombre_ejercicio }}</h1>
    <p>{{ subgrupo_muscular }}</p>
</div>

{% if imagen_url %}
<div class="ejercicio-image-container">
    <img src="{{ imagen_url }}" alt="{{ nombre_ejercicio }}">
</div>
{% endif %}

<form id="detalle-ejercicio-form">
    <div class="card">
        <label style="display: block; margin-bottom: 8px; font-weight: 600;">¿Cuántas series vas a hacer?</label>
        <input type="number" id="series" name="series" placeholder="Ej: 3" min="1" required oninput="generarSeries()" style="font-size: 1.2rem; text-align: center;">
    </div>

    <div id="series-container"></div>

    <div style="margin-top: 24px;">
        <button type="submit" class="btn btn-primary">Guardar Entrenamiento</button>
    </div>
</form>
{% endblock %}

{% block extra_js %}
<script>
function generarSeries() {
    const seriesContainer = document.getElementById("series-container");
    const numSeries = parseInt(document.getElementById("series").value) || 0;
    
    // Save current values to restore them
    const currentValues = {};
    const inputs = seriesContainer.querySelectorAll('input');
    inputs.forEach(input => {
        currentValues[input.id] = input.value;
    });

    seriesContainer.innerHTML = "";

    for (let i = 1; i <= numSeries; i++) {
        const serieRow = document.createElement("div");
        serieRow.classList.add("serie-row");
        
        serieRow.innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <span style="font-weight: 700; color: var(--accent-color);">SERIE ${i}</span>
            </div>
            <div class="input-row">
                <div class="input-card">
                    <label>Reps</label>
                    <input type="number" id="repeticiones_${i}" placeholder="0" min="1" required>
                </div>
                <div class="input-card">
                    <label>Peso (kg)</label>
                    <input type="number" id="peso_${i}" placeholder="0" min="0" step="0.5" required>
                </div>
            </div>
        `;
        seriesContainer.appendChild(serieRow);
        
        // Restore values if they existed
        if (currentValues[`repeticiones_${i}`]) {
            document.getElementById(`repeticiones_${i}`).value = currentValues[`repeticiones_${i}`];
        }
        if (currentValues[`peso_${i}`]) {
            document.getElementById(`peso_${i}`).value = currentValues[`peso_${i}`];
        }
    }
}

document.getElementById('detalle-ejercicio-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const numSeries = parseInt(document.getElementById("series").value);
    const ejercicioId = "{{ ejercicio_id }}";
    let datosEjercicio = [];

    for (let i = 1; i <= numSeries; i++) {
        const rep = document.getElementById(`repeticiones_${i}`).value;
        const peso = document.getElementById(`peso_${i}`).value;
        if (!rep || !peso) return alert(`Completa la serie ${i}`);
        datosEjercicio.push({ serie: i, repeticiones: rep, peso: peso });
    }

    fetch(`/guardar_series/${ejercicioId}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ series: datosEjercicio })
    })
    .then(r => r.json())
    .then(data => {
        if (data.error) alert(data.error);
        else {
            alert("¡Entrenamiento guardado!");
            window.history.back();
        }
    });
});

// Load existing data if coming from history
document.addEventListener("DOMContentLoaded", function () {
    const urlParams = new URLSearchParams(window.location.search);
    const fecha = urlParams.get("fecha");
    const ejercicioId = "{{ ejercicio_id }}";

    if (fecha && ejercicioId) {
        fetch(`/api/obtener_series/${ejercicioId}/${fecha}`)
            .then(r => r.json())
            .then(data => {
                if (data.series) {
                    document.getElementById("series").value = data.series.length;
                    generarSeries();
                    data.series.forEach(s => {
                        document.getElementById(`repeticiones_${s.serie}`).value = s.repeticiones;
                        document.getElementById(`peso_${s.serie}`).value = s.peso;
                    });
                }
            });
    }
});
</script>
{% endblock %}
