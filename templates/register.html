{% extends "base.html" %}

{% block title %}Registro - GymBRoot{% endblock %}

{% block content %}
<div class="card">
    <h1 style="text-align: center;">Crear Cuenta</h1>
    <p style="text-align: center; margin-bottom: 24px;">Únete a la mejor comunidad fitness</p>
    
    <form action="{{ url_for('register') }}" method="POST">
        <label style="display: block; margin-bottom: 8px; font-weight: 600;">Nombre completo</label>
        <input type="text" name="nombre" placeholder="Tu nombre" required>

        <label style="display: block; margin-bottom: 8px; font-weight: 600;">Email</label>
        <input type="email" name="email" placeholder="email@dominio.com" required>
        
        <label style="display: block; margin-bottom: 8px; font-weight: 600;">Contraseña</label>
        <input type="password" name="password" placeholder="Mínimo 6 caracteres" required>
        
        <button type="submit" class="btn btn-primary" style="margin-top: 12px;">Empezar ahora</button>
    </form>
    
    <div style="text-align: center; margin-top: 24px;">
        <p>¿Ya tienes cuenta? <a href="{{ url_for('login') }}" style="color: var(--accent-color); text-decoration: none;">Inicia sesión</a></p>
    </div>
</div>
{% endblock %}
