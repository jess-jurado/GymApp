{% extends "base.html" %}

{% block title %}Iniciar Sesión - GymBRoot{% endblock %}

{% block content %}
<div class="card">
    <h1 style="text-align: center;">Acceder</h1>
    <p style="text-align: center; margin-bottom: 24px;">Introduce tus credenciales</p>
    
    <form action="{{ url_for('login') }}" method="POST">
        <label style="display: block; margin-bottom: 8px; font-weight: 600;">Email</label>
        <input type="email" name="email" placeholder="ejemplo@gym.com" required>
        
        <label style="display: block; margin-bottom: 8px; font-weight: 600;">Contraseña</label>
        <input type="password" name="password" placeholder="••••••••" required>
        
        <button type="submit" class="btn btn-primary" style="margin-top: 12px;">Entrar</button>
    </form>
    
    <div style="text-align: center; margin-top: 24px;">
        <p>¿No tienes cuenta? <a href="{{ url_for('register') }}" style="color: var(--accent-color); text-decoration: none;">Regístrate</a></p>
    </div>
</div>
{% endblock %}
